<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2択あみだくじ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#222}
.wrap{max-width:480px;margin:auto;padding:24px 18px 32px;text-align:center}
h1{font-size:25px;margin:8px 0}.sub{color:#666;margin:0 0 22px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:0;border-radius:18px;background:#fff;padding:20px 10px;font-size:26px;font-weight:700;box-shadow:0 3px 12px #0001}
.choice:disabled{opacity:.45}#draw{margin-top:22px;background:#fff;border-radius:20px;padding:14px 10px 18px;box-shadow:0 3px 12px #0001}
canvas{width:100%;height:auto}.result{font-size:27px;font-weight:800;margin-top:12px;min-height:38px}.again{margin-top:18px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 18px;font-size:16px}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 2択あみだくじ</h1>
<p class="sub">①か②、好きな方を選んでね！</p>
<div class="choices">
<button class="choice" id="c1">①</button>
<button class="choice" id="c2">②</button>
</div>
<div id="draw" class="hidden">
<canvas id="canvas" width="420" height="430"></canvas>
<div id="result" class="result"></div>
</div>
<button id="again" class="again hidden">もう一度やる</button>
</div>
<script>
(() => {
const c1=document.getElementById('c1'),c2=document.getElementById('c2');
const draw=document.getElementById('draw'),again=document.getElementById('again');
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),result=document.getElementById('result');
const x=[130,290],top=48,bottom=370,mid=209;

let winner; // 0=①, 1=②

function reset(){
  winner=Math.random()<0.5?0:1;
  c1.disabled=c2.disabled=false;
  draw.classList.add('hidden');again.classList.add('hidden');result.textContent='';
}
function choose(chosen){
  c1.disabled=c2.disabled=true;draw.classList.remove('hidden');

  // The chosen top line goes straight down until the crossing.
  // If chosen is the winner, cross once; otherwise stay straight.
  // Thus the red path always ends at the correct bottom label.
  const cross = (chosen===winner);
  const end = cross ? 1-chosen : chosen;

  ctx.clearRect(0,0,420,430);
  ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#333';

  // vertical lines
  for(const xx of x){ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx,bottom);ctx.stroke()}

  // One horizontal rung placed only when needed.
  if(cross){
    ctx.beginPath();ctx.moveTo(x[0],mid);ctx.lineTo(x[1],mid);ctx.stroke();
  }

  ctx.fillStyle='#333';ctx.textAlign='center';ctx.font='bold 24px sans-serif';
  ctx.fillText('①',x[0],25);ctx.fillText('②',x[1],25);
  ctx.font='bold 20px sans-serif';
  ctx.fillText('😈 はずれ',x[0],408);ctx.fillText('🎉 あたり',x[1],408);

  // Animate the selected route.
  const pts=cross
    ? [{x:x[chosen],y:top},{x:x[chosen],y:mid},{x:x[end],y:mid},{x:x[end],y:bottom}]
    : [{x:x[chosen],y:top},{x:x[chosen],y:bottom}];

  let i=1,step=0;
  ctx.lineWidth=9;ctx.strokeStyle='#e74c3c';
  function frame(){
    if(i>=pts.length){
      // IMPORTANT: result is based on the hidden winner, not on a display label.
      result.textContent=(chosen===winner)?'🎉 あたり！':'😂 はずれ！';
      again.classList.remove('hidden');return;
    }
    const a=pts[i-1],b=pts[i],len=Math.hypot(b.x-a.x,b.y-a.y);
    step+=10;const p=Math.min(1,step/len);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x+(b.x-a.x)*p,a.y+(b.y-a.y)*p);ctx.stroke();
    if(p>=1){i++;step=0}requestAnimationFrame(frame);
  }
  frame();
}
c1.onclick=()=>choose(0);c2.onclick=()=>choose(1);again.onclick=reset;reset();
})();
</script>
</body>
</html>
